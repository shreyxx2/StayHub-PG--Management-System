<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StayHub PG Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
                <i class="fas fa-hotel text-primary fs-3"></i>
                <span>StayHub <span class="text-secondary fw-bold">PG</span></span>
            </a>
            <div class="ms-auto">
                <a href="/index.html" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-home me-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="custom-card p-4 p-md-5 mb-4 shadow">
                    <div class="text-center mb-4">
                        <div class="kpi-icon green mx-auto mb-2">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create an Account</h3>
                        <p class="text-muted small">Join StayHub as a Student/Tenant or PG Owner</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">I am registering as *</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="role" id="roleTenant" value="tenant" checked>
                                    <label class="form-check-label fw-semibold" for="roleTenant">
                                        <i class="fas fa-user-graduate me-1 text-success"></i> Student / Tenant
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="role" id="roleOwner" value="owner">
                                    <label class="form-check-label fw-semibold" for="roleOwner">
                                        <i class="fas fa-user-tie me-1 text-primary"></i> PG Owner
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Full Legal Name *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" id="regName" class="form-control" placeholder="e.g. Rahul Sharma" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Phone Number * (Unique)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">+91</span>
                                <input type="tel" id="regPhone" class="form-control" placeholder="9876543210" pattern="[0-9]{10}" required>
                            </div>
                            <div class="form-text small">Must be a valid 10-digit mobile number.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Email Address * (Login ID)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-muted">Secure Password *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required>
                            </div>
                        </div>

                        <button type="submit" id="regSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                            <i class="fas fa-check-circle me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="/login.html" class="small fw-semibold text-primary ms-1">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const submitBtn = document.getElementById('regSubmitBtn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const role = document.querySelector('input[name="role"]:checked').value;
                const name = document.getElementById('regName').value.trim();
                const phone = document.getElementById('regPhone').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;

                try {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Registering in Database...';

                    const res = await apiRequest('/auth/register', {
                        method: 'POST',
                        body: JSON.stringify({ role, name, phone, email, password })
                    });

                    setAuth(res.token, res.user);
                    showToast('Registration successful! Redirecting...', 'success');

                    setTimeout(() => {
                        if (res.user.role === 'owner') {
                            window.location.href = '/owner-dashboard.html';
                        } else {
                            window.location.href = '/tenant-dashboard.html';
                        }
                    }, 1000);

                } catch (err) {
                    console.error(err);
                    showToast(err.message || 'Registration failed', 'danger');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check-circle me-1"></i> Register Account';
                }
            });
        });
    </script>
</body>
</html>
