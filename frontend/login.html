<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StayHub PG Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/index.html">
                <i class="fas fa-hotel text-primary fs-3"></i>
                <span>StayHub <span class="text-secondary fw-bold">PG</span></span>
            </a>
            <div class="ms-auto">
                <a href="/index.html" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-home me-1"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="custom-card p-4 p-md-5 mb-4 shadow">
                    <div class="text-center mb-4">
                        <div class="kpi-icon blue mx-auto mb-2">
                            <i class="fas fa-user-lock"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Welcome to StayHub</h3>
                        <p class="text-muted small">Sign in with your role-based credentials</p>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" class="form-control" placeholder="user@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-muted">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                            <i class="fas fa-sign-in-alt me-1"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="/register.html" class="small fw-semibold text-primary ms-1">Register as Tenant/Owner</a>
                    </div>

                    <!-- Quick Demo One-Click Login Buttons for College Viva Demo -->
                    <div class="mt-4 pt-3 border-top">
                        <span class="d-block small text-muted text-center fw-semibold mb-2">
                            <i class="fas fa-bolt text-warning me-1"></i> Quick Demo Logins (For Viva Presentation)
                        </span>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-danger btn-sm text-start demo-login-btn" 
                                data-email="admin@stayhub.com" data-pass="password123">
                                <i class="fas fa-user-shield me-2"></i> <strong>Admin</strong> (admin@stayhub.com)
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm text-start demo-login-btn" 
                                data-email="ramesh@stayhub.com" data-pass="password123">
                                <i class="fas fa-user-tie me-2"></i> <strong>Owner: Ramesh Sharma</strong> (ramesh@stayhub.com)
                            </button>
                            <button type="button" class="btn btn-outline-success btn-sm text-start demo-login-btn" 
                                data-email="arjun@gmail.com" data-pass="password123">
                                <i class="fas fa-user-graduate me-2"></i> <strong>Tenant: Arjun Mehta</strong> (arjun@gmail.com)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPassword');
            const submitBtn = document.getElementById('loginSubmitBtn');

            // Handle Quick Demo Click
            document.querySelectorAll('.demo-login-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    emailInput.value = btn.dataset.email;
                    passInput.value = btn.dataset.pass;
                    loginForm.dispatchEvent(new Event('submit'));
                });
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = emailInput.value.trim();
                const password = passInput.value;

                try {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Signing In...';

                    const res = await apiRequest('/auth/login', {
                        method: 'POST',
                        body: JSON.stringify({ email, password })
                    });

                    setAuth(res.token, res.user);
                    showToast(`Welcome back, ${res.user.name}!`, 'success');

                    // Redirect based on role
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect');

                        if (redirectUrl) {
                            window.location.href = redirectUrl;
                        } else if (res.user.role === 'admin') {
                            window.location.href = '/admin-dashboard.html';
                        } else if (res.user.role === 'owner') {
                            window.location.href = '/owner-dashboard.html';
                        } else {
                            window.location.href = '/tenant-dashboard.html';
                        }
                    }, 800);

                } catch (err) {
                    console.error(err);
                    showToast(err.message || 'Login failed', 'danger');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Sign In';
                }
            });
        });
    </script>
</body>
</html>
